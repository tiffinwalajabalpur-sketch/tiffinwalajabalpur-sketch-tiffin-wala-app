<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiffin Wala &ndash; Ghar Jaisa Khana, Rozana | Jabalpur</title>
  <meta name="description" content="Tiffin Wala delivers fresh home-style Indian meals in Jabalpur. Regular Meal &#8377;79, Premium Meal &#8377;99. Pure Veg, Hygienic, On-Time." />
  <meta name="keywords" content="tiffin wala jabalpur, tiffin service jabalpur, home food delivery jabalpur, ghar jaisa khana, pure veg tiffin" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
  // ── Constants ────────────────────────────────────────────
  const OWNER_PHONE = '919691954190';

  // ── State ─────────────────────────────────────────────────
  const state = {
    step: 1,
    qtyPremium: 0,
    qtyRegular: 0,
    name: '',
    phone: '',
    area: '',
    address: '',
    mapLink: ''
  };

  let lastWaUrl = '';

  // ── Wizard open/close & Time check ────────────────────────
  function openWizard(presetType = null) {
    // Check if it's past 8 PM (20:00)
    
    
    document.getElementById('wizard-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';

    

    // Reset fields if opening fresh
    if (presetType === 'premium' && state.qtyPremium === 0) {
      state.qtyPremium = 1;
      state.qtyRegular = 0;
    } else if (presetType === 'regular' && state.qtyRegular === 0) {
      state.qtyRegular = 1;
      state.qtyPremium = 0;
    }
    
    updateQtyUI();
    goToStep(1);
  }

  function closeWizard() {
    document.getElementById('wizard-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  // ── Step navigation ───────────────────────────────────────
  function goToStep(n) {
    state.step = n;
    document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));

    if (n === 1) {
      document.getElementById('step-1').classList.add('active');
      document.getElementById('wizard-progress').style.width = '50%';
      document.getElementById('step-label').textContent = '1';
    } else if (n === 2) {
      document.getElementById('step-2').classList.add('active');
      document.getElementById('wizard-progress').style.width = '100%';
      document.getElementById('step-label').textContent = '2';
      buildReview();
    } else if (n === 99) {
      document.getElementById('step-success').classList.add('active');
    }

    document.getElementById('wizard-sheet').scrollTop = 0;
  }

  // ── Quantity Updates ──────────────────────────────────────
  function updateQty(type, delta) {
    if (type === 'premium') {
      state.qtyPremium = Math.max(0, state.qtyPremium + delta);
    } else {
      state.qtyRegular = Math.max(0, state.qtyRegular + delta);
    }
    updateQtyUI();
  }

  function updateQtyUI() {
    document.getElementById('qty-premium').textContent = state.qtyPremium;
    document.getElementById('qty-regular').textContent = state.qtyRegular;
  }

  // ── Step 1 Validation ─────────────────────────────────────
  function validateAndReview() {
    // Clear errors
    const errEl = document.getElementById('wiz-errors');
    errEl.classList.add('hidden');
    document.querySelectorAll('.tw-input').forEach(el => el.classList.remove('border-red-500'));

    let errors = [];
    
    // Check quantities
    if (state.qtyPremium === 0 && state.qtyRegular === 0) {
      errors.push("Please select at least 1 meal to proceed.");
    }

    // Get field values
    const name = document.getElementById('wiz_name').value.trim();
    const phone = document.getElementById('wiz_phone').value.trim();
    const area = document.getElementById('wiz_area').value;
    const address = document.getElementById('wiz_address').value.trim();
    
    if (!name) { errors.push("Full Name is required."); document.getElementById('wiz_name').classList.add('border-red-500'); }
    if (!phone || !/^\d{10}$/.test(phone)) { errors.push("Valid 10-digit WhatsApp number required."); document.getElementById('wiz_phone').classList.add('border-red-500'); }
    if (!area) { errors.push("Delivery Area is required."); document.getElementById('wiz_area').classList.add('border-red-500'); }
    if (!address) { errors.push("Full Address is required."); document.getElementById('wiz_address').classList.add('border-red-500'); }

    if (errors.length > 0) {
      errEl.innerHTML = errors.join('<br>');
      errEl.classList.remove('hidden');
      return;
    }

    // Save state
    state.name = name;
    state.phone = phone;
    state.area = area;
    state.address = address;
    state.mapLink = document.getElementById('wiz_map').value.trim();

    goToStep(2);
  }

  // ── Review & Submit ───────────────────────────────────────
  function buildReview() {
    const total = (state.qtyPremium * 99) + (state.qtyRegular * 79);
    
    let mealTexts = [];
    if (state.qtyPremium > 0) mealTexts.push(`${state.qtyPremium}x Premium Meal (₹99)`);
    if (state.qtyRegular > 0) mealTexts.push(`${state.qtyRegular}x Regular Meal (₹79)`);
    const mealString = mealTexts.join('<br>');

    document.getElementById('rev-name').textContent = state.name;
    document.getElementById('rev-phone').textContent = '+91 ' + state.phone;
    document.getElementById('rev-area').textContent = state.area;
    document.getElementById('rev-meals').innerHTML = mealString;
    document.getElementById('rev-total').textContent = '₹' + total;

    const today = new Date().toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
    
    const plainMealString = mealTexts.join(' & ');

    const message = (
      `🍱 *NEW DINNER BOOKING*
` +
      `————————————
` +
      `👤 *Name:* ${state.name}
` +
      `📱 *WhatsApp:* +91 ${state.phone}
` +
      `📍 *Area:* ${state.area}
` +
      `🏠 *Address:* ${state.address}
` +
      (state.mapLink ? `🗺️ *Map:* ${state.mapLink}
` : ``) +
      `————————————
` +
      `🍽️ *Meals:* ${plainMealString}
` +
      `💰 *Total:* ₹${total}
` +
      `————————————
` +
      `Booking for: ${today} (Dinner)`
    );

    document.getElementById('wa-message-preview').textContent = message;
    lastWaUrl = `https://wa.me/${OWNER_PHONE}?text=${encodeURIComponent(message)}`;
  }

  async function submitOrderFinal() {
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    const originalContent = btn.innerHTML;
    btn.innerHTML = 'Processing...';

    const total = (state.qtyPremium * 99) + (state.qtyRegular * 79);
    let mealTexts = [];
    if (state.qtyPremium > 0) mealTexts.push(`${state.qtyPremium}x Premium`);
    if (state.qtyRegular > 0) mealTexts.push(`${state.qtyRegular}x Regular`);

    const fd = new FormData();
    fd.append('customer_name', state.name);
    fd.append('whatsapp_number', state.phone);
    fd.append('address', state.address);
    fd.append('customer_type', 'Standard');
    fd.append('thali_type', mealTexts.join(', '));
    fd.append('meal_time', 'dinner');
    fd.append('delivery_area', state.area);
    const todayStr = new Date().toISOString().split('T')[0];
    fd.append('booking_dates', todayStr);
    fd.append('total_amount', total);
    fd.append('map_link', state.mapLink);

    try {
      const res = await fetch('/submit-order', { method:'POST', body: fd });
      const data = await res.json();
      if (data.success) {
        window.open(lastWaUrl, '_blank');
        goToStep(99);
      } else {
        alert('Error: ' + data.message);
        btn.disabled = false;
        btn.innerHTML = originalContent;
      }
    } catch (e) {
      alert('Network error. Please try again.');
      btn.disabled = false;
      btn.innerHTML = originalContent;
    }
  }

  // ── Quick Booking Form Logic ──────────────────────────────
  function handleQuickBookYes() {
    const name = document.getElementById('qb-name').value.trim();
    const area = document.getElementById('qb-area').value;
    if (!name || !area) {
      alert("Please enter your name and select an area first.");
      return;
    }
    const msg = `Hi Tiffin Wala! I want to book dinner today.\nName: ${name}\nArea: ${area}`;
    window.open(`https://wa.me/${OWNER_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  function handleQuickBookNo() {
    document.getElementById('quick-book-form').classList.add('hidden');
    document.getElementById('quick-book-feedback').classList.remove('hidden');
  }

  function sendFeedback(reason) {
    document.getElementById('quick-book-feedback').classList.add('hidden');
    document.getElementById('quick-book-thanks').classList.remove('hidden');
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeWizard();
  });
</script>
</body>
</html>
